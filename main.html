<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Grand Ad Editor Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
            color: #0f172a;
        }

        h2 {
            font-size: 1.1rem;
            margin: 25px 0 10px 0;
            color: #334155;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .section {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .radio-group label {
            flex: 1;
            min-width: 110px;
            text-align: center;
            background: #f8fafc;
            border: 2px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .radio-group input[type="radio"] {
            display: none;
        }

        .radio-group label:has(input[type="radio"]:checked) {
            border-color: var(--primary);
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .feature-item select {
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid var(--border);
            margin-left: auto;
        }

        select.form-control, input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 2px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: white;
        }

        select.form-control:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .result-box {
            margin-top: 25px;
            background: #fafafa;
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }

        .result-box.error-box {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .result-box h3 {
            margin-top: 0;
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
        }

        #adPreview {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
            color: #1e1b4b;
            word-break: break-word;
            padding-right: 180px;
        }

        #adPreview.error-text {
            color: var(--danger);
        }

        .btn-group {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            min-width: 75px;
        }

        .copy-btn:hover {
            background: var(--primary-hover);
        }

        /* Smooth Copied State Style */
        .copy-btn.copied-state {
            background: var(--success);
            color: white;
        }

        .reset-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .reset-btn:hover {
            background: var(--danger-hover);
        }

        .hidden {
            display: none !important;
        }

<style>
/* ===== Colorful section theme ===== */
:root{
    --primary:#7c3aed;
    --primary-hover:#6d28d9;
    --bg:#0b1020;
    --card-bg:#111827;
    --text:#e5e7eb;
    --border:#334155;
    --success:#22c55e;
    --danger:#ef4444;
}

body{
    background:
        radial-gradient(circle at 10% 10%, rgba(124,58,237,.18), transparent 28%),
        radial-gradient(circle at 90% 20%, rgba(14,165,233,.14), transparent 28%),
        linear-gradient(135deg,#070b14,#111827 55%,#0f172a);
    color:var(--text);
}

.container{
    background:rgba(15,23,42,.96);
    border:1px solid rgba(148,163,184,.25);
    box-shadow:0 20px 55px rgba(0,0,0,.45);
}

h1{
    color:#f8fafc;
    text-shadow:0 2px 15px rgba(124,58,237,.35);
}

h2{
    border-bottom:0;
    padding:12px 16px;
    border-radius:10px;
    color:#fff;
    margin-top:28px;
    box-shadow:0 5px 18px rgba(0,0,0,.18);
}

/* Individual section colors */
#realestateWorkspace h2{
    background:linear-gradient(90deg,#2563eb,#3b82f6);
}
#autoWorkspace h2{
    background:linear-gradient(90deg,#7c3aed,#a855f7);
}
#businessWorkspace h2{
    background:linear-gradient(90deg,#059669,#10b981);
}

/* Make the main category controls colorful */
.radio-group label{
    background:rgba(30,41,59,.9);
    color:#e2e8f0;
    border-color:#475569;
}
.radio-group label:hover{
    transform:translateY(-1px);
    border-color:#818cf8;
}
.radio-group label:has(input[type="radio"]:checked){
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;
    border-color:#a78bfa;
    box-shadow:0 5px 16px rgba(99,102,241,.3);
}

/* Section/workspace panels */
#realestateWorkspace,
#autoWorkspace,
#businessWorkspace{
    border-radius:14px;
    padding:4px 10px 14px;
}

#realestateWorkspace{
    background:linear-gradient(180deg,rgba(37,99,235,.08),rgba(37,99,235,.02));
    border:1px solid rgba(59,130,246,.18);
}
#autoWorkspace{
    background:linear-gradient(180deg,rgba(124,58,237,.09),rgba(124,58,237,.02));
    border:1px solid rgba(168,85,247,.18);
}
#businessWorkspace{
    background:linear-gradient(180deg,rgba(16,185,129,.08),rgba(16,185,129,.02));
    border:1px solid rgba(16,185,129,.18);
}
#othersWorkspace{
    background:linear-gradient(180deg,rgba(245,158,11,.09),rgba(245,158,11,.02));
    border:1px solid rgba(245,158,11,.20);
}
#othersWorkspace h2{
    background:linear-gradient(90deg,#d97706,#f59e0b);
}
.others-warning{
    margin:10px 0 12px;
    padding:10px 13px;
    border:1px solid rgba(251,191,36,.55);
    border-radius:9px;
    background:rgba(120,53,15,.22);
    color:#fde68a;
    font-size:13px;
    line-height:1.45;
    display:flex;
    align-items:flex-start;
    gap:8px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}
.others-warning strong{color:#fff7ed;}
.radio-group label small{font-size:.78em;opacity:.72;font-weight:500;}

/* Feature cards */
.features-grid{
    background:rgba(15,23,42,.72);
    border-color:#334155;
}
.feature-item{
    padding:9px 10px;
    border-radius:8px;
    background:rgba(30,41,59,.55);
    transition:.2s ease;
}
.feature-item:hover{
    background:rgba(51,65,85,.8);
}

/* Inputs */
select.form-control,input[type="text"]{
    background:#0f172a;
    color:#f8fafc;
    border-color:#475569;
}
select.form-control:focus,input[type="text"]:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.15);
}

/* Result/output */
.result-box{
    width:100%;
    box-sizing:border-box;
    background:linear-gradient(135deg,rgba(30,41,59,.96),rgba(15,23,42,.96));
    border-color:#8b5cf6;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.result-box h3{
    color:#a5b4fc;
}
#adPreview{
    color:#f8fafc;
    min-width:0;
    overflow-wrap:anywhere;
}

/* Buttons */
.copy-btn{
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
}
.copy-btn:hover{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
}
.reset-btn{
    background:linear-gradient(135deg,#dc2626,#ef4444);
}
.reset-btn:hover{
    background:linear-gradient(135deg,#b91c1c,#dc2626);
}

/* Small section icons */
.section-icon{
    display:inline-flex;
    width:28px;
    height:28px;
    align-items:center;
    justify-content:center;
    margin-right:8px;
    border-radius:7px;
    background:rgba(255,255,255,.16);
    font-size:16px;
    vertical-align:middle;
}
</style>


<style>
.others-controls-grid{align-items:end;}
/* Others: professional, neutral controls with editable item fields and popup pickers. */
.others-search-btn{width:100%;min-height:52px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 15px;color:#f8fafc;background:#111827;border:1px solid #475569;border-radius:8px;transition:.18s ease;box-sizing:border-box;}
.others-search-btn:hover{border-color:#94a3b8;background:#172033;box-shadow:0 0 0 3px rgba(148,163,184,.08);}
.others-search-main{display:flex;align-items:center;gap:9px;}
.others-search-main .search-icon{font-size:17px;opacity:.9;}

.others-picker-arrow{font-size:17px;opacity:.65;line-height:1;}
.others-item-output{width:100%;min-height:52px;box-sizing:border-box;}

.others-edit-picker button{flex:0 0 42px;min-width:42px;border:1px solid #475569;border-radius:7px;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:16px;transition:.18s ease;}
.others-edit-picker button:hover{background:#334155;border-color:#94a3b8;}
.others-item-compact label{font-size:12px;}
.others-item-compact .others-edit-picker input{min-height:34px;font-size:12px;padding:7px 9px;}
.others-item-compact .others-edit-picker button{min-height:34px;flex-basis:36px;min-width:36px;font-size:14px;}

.others-popup-header{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;}
.others-popup-header strong{display:block;font-size:17px;}
.others-popup-header small{display:block;margin-top:3px;color:#94a3b8;font-size:12px;}
.others-popup-close{width:34px;height:34px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#fff;font-size:23px;cursor:pointer;}
.others-popup-close:hover{background:#334155;}
#othersPopupSearch{min-height:44px;font-size:14px;}

.others-popup-item:hover,.others-popup-item:focus{border-color:#64748b;background:#1e293b;outline:none;}

</style>

// FIXED COPY TEXT SYSTEM - Text updates dynamically without an alert popup box
function copyText() {
    const adText = document.getElementById('adPreview').innerText;
    const btn = document.getElementById('copyBtn');

    function showCopiedAndReset() {
        btn.innerText = "Copied!";
        btn.classList.add("copied-state");setTimeout(() => {
            // After Copy: perform a full reset of every form field,
            // but preserve ONLY the selected advertisement category.
            const category = document.querySelector('input[name="category"]:checked')?.value || "others";

            resetForm();

            // Restore only the category that was selected before Copy.
            const categoryRadio = document.querySelector(`input[name="category"][value="${category}"]`);
            if (categoryRadio) categoryRadio.checked = true;
            switchCategory();

            btn.innerText = "Copy";
            btn.classList.remove("copied-state");
        }, 1500);
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(adText)
            .then(showCopiedAndReset)
            .catch(() => {
                fallbackCopy(adText);
                showCopiedAndReset();
            });
    } else {
        fallbackCopy(adText);
        showCopiedAndReset();
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try { document.execCommand("copy"); } catch (e) {}
    textarea.remove();
}

function filterOthersTemplates() {
    const select = document.getElementById("othersTemplateSelect");
    if (!select) return;
    const query = "";
    const current = select.value;
    select.innerHTML = '<option value="">-- Search and select an ad --</option>';

    const seen = new Set();
    OTHERS_AD_TEMPLATES.forEach(template => {
        const clean = normalizeOthersAction(stripOthersPrice(template));
        if (!clean) return;
        if (query && !clean.toLowerCase().includes(query)) return;
        const key = clean.toLowerCase().replace(/\s+/g, " ").trim();
        if (seen.has(key)) return;
        seen.add(key);
        const option = document.createElement("option");
        option.value = clean;
        option.textContent = clean;
        select.appendChild(option);
    });

    if (current) {
        const exists = Array.from(select.options).some(o => o.value === current);
        if (exists) select.value = current;
    }

    if (!document.getElementById("othersTemplatePopup")?.classList.contains("hidden")) {
        renderOthersPopupList();
    }
}

function normalizeOthersRawItem(text) {
    let value = normalizeOthersAction(stripOthersPrice(text || ""));

    // Item 2/3 should show the clean item name, not the ad wording.
    // Remove gender tags and common colour descriptors so variants such as
    // "Buying black Lui Vi pants for men" become simply "Lui Vi pants".
    value = value
        .replace(/\s+(?:for|for the)\s+(?:men|women|male|female)\b/gi, "")
        .replace(/\b(?:for|of)\s+(?:men|women|male|female)\b/gi, "")
        .replace(/\b(?:black|white|red|blue|green|yellow|pink|purple|orange|brown|beige|cream|gray|grey|gold|golden|silver|colorful|colourful|monochrome|one[- ]color|one[- ]colour)\b\s*/gi, "")
        .replace(/\s{2,}/g, " ")
        .replace(/\s+([,.])/g, "$1")
        .replace(/^[,.:;\-\s]+|[,.:;\-\s]+$/g, "")
        .trim();

    return value;
}

function getOthersPopupItems(query = "") {
    const q = String(query || "").toLowerCase().trim();
    const target = othersPopupTarget || "othersCustomText";
    const useRawItem = target === "othersCustomText2";
    const seen = new Set();
    const items = [];
    OTHERS_AD_TEMPLATES.forEach(template => {
        const base = normalizeOthersAction(stripOthersPrice(template));
        const clean = useRawItem ? normalizeOthersRawItem(base) : base;
        if (!clean) return;
        if (q && !clean.toLowerCase().includes(q)) return;
        const key = clean.toLowerCase().replace(/\s+/g, " ").trim();
        if (seen.has(key)) return;
        seen.add(key);
        items.push(clean);
    });
    return items;
}

let othersPopupTarget = "othersCustomText";

function openOthersTemplatePopup(targetInputId = "othersCustomText") {
    othersPopupTarget = targetInputId || "othersCustomText";
    const popup = document.getElementById("othersTemplatePopup");
    const search = document.getElementById("othersPopupSearch");
    if (!popup || !search) return;

    search.value = "";
    const titles = {
        othersCustomText: "Select Item 1",
        othersCustomText2: "Select Item 2",
    };
    const title = document.getElementById("othersPopupTitle");
    if (title) title.textContent = titles[othersPopupTarget] || "Select Others Ad";
    popup.classList.remove("hidden");
    popup.setAttribute("aria-hidden", "false");
    renderOthersPopupList();
    setTimeout(() => search.focus(), 0);
}

function closeOthersTemplatePopup() {
    const popup = document.getElementById("othersTemplatePopup");
    if (!popup) return;
    popup.classList.add("hidden");
    popup.setAttribute("aria-hidden", "true");
}

function renderOthersPopupList() {
    const list = document.getElementById("othersPopupList");
    const search = document.getElementById("othersPopupSearch");
    if (!list) return;
    const items = getOthersPopupItems(search?.value || "");
    list.innerHTML = "";

    if (!items.length) {
        list.innerHTML = '<div class="others-popup-empty">No matching items found.</div>';
        return;
    }

    const fragment = document.createDocumentFragment();
    items.forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "others-popup-item";
        button.textContent = item;
        button.onclick = () => chooseOthersPopupItem(item);
        fragment.appendChild(button);
    });
    list.appendChild(fragment);
}

function chooseOthersPopupItem(item) {
    const target = document.getElementById(othersPopupTarget) || document.getElementById("othersCustomText");
    const select = document.getElementById("othersTemplateSelect");
    if (target) target.value = item;
    if (select) {
        const exists = Array.from(select.options).some(o => o.value === item);
        if (!exists) {
            const option = document.createElement("option");
            option.value = item;
            option.textContent = item;
            select.appendChild(option);
        }
        select.value = item;
    }
    closeOthersTemplatePopup();
    if (target && target.id === "othersCustomText") {
        const color = document.getElementById("othersSpecialColor");
        const type = document.getElementById("othersSpecialType");
        if (color) color.value = "";
        if (type) type.value = "";
        updateOthersSpecialFields();
    }
    updateAd();
}

    const item1 = document.getElementById("othersCustomText")?.value.trim();

const item2 = document.getElementById("othersCustomText2")?.value.trim();
if (item2Text) item2Text.textContent = item2 || "+ Select Item 2";
}

function extractOthersPrice(template) {
    if (!template) return { price: "", each: false };
    const m = template.match(/(?:Price|Budget|Rent|Salary):\s*\$?([^.]*(?:\.[^.]*)?)\s*\.?$/i);
    if (!m) return { price: "", each: false };
    let raw = m[1].trim();
    raw = raw.replace(/\s*each\s*$/i, "").trim();
    return { price: raw === "Negotiable" ? "" : raw, each: false };
}

function stripOthersPrice(template) {
    if (!template) return "";
    // Strip every trailing Price/Budget/Rent/Salary field, including source
    // variants such as "Price:: Negotiable" or "Budget: $300.000.".
    let value = String(template).trim();
    value = value.replace(/\s*(?:Price|Budget|Rent|Salary)\s*:{1,2}\s*.*$/i, "");
    return value.trim().replace(/[.\s]+$/, "");
}

function normalizeOthersAction(text) {
    let value = (text || "").trim();
    // Remove any existing action at the beginning. updateAd() will add it once.
    // A bare action ("Buying", "Selling", "Trading", or "Selling or trading")
    // is not a real Others item and must never appear in the search/template menu.
    value = value.replace(/^(?:Selling\s+or\s+trading|Selling|Buying|Trading)(?:\s+|$)/i, "").trim();
    return value;
}

function detectOthersEach(text) {
    const value = (text || '').toLowerCase().trim();

    // Explicit per-item wording.
    if (/\beach\b/.test(value)) return true;

    // "bulk" means the ad refers to multiple items.
    if (/\b(?:in\s+)?bulk\b/.test(value)) return true;

    // Ignore numbers that describe a type/model/version ("type 7", "type 15").
    const withoutTypes = value.replace(/\btype\s*#?\s*\d+(?:\s*(?:and|,|&)\s*\d+)*/gi, ' ');

    // A quantity greater than one means applies. A quantity of one does not.
    const numberWords = {
        two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7,
        eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12,
        thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16,
        seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20,
        thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70,
        eighty: 80, ninety: 90, hundred: 100, thousand: 1000
    };

    // Only treat a numeric/word quantity as a quantity when it is followed by
    // an item noun, not when it is part of "type 7", "700 V3", etc.
    const quantityPattern = /\b(\d+)\s+(?=[a-z])/g;
    let match;
    while ((match = quantityPattern.exec(withoutTypes)) !== null) {
        const n = Number(match[1]);
        if (n > 1) return true;
    }
    for (const [word, n] of Object.entries(numberWords)) {
        const re = new RegExp('\\b' + word + '\\s+(?=[a-z])');
        if (n > 1 && re.test(withoutTypes)) return true;
    }

    // Clear plural nouns. This is intentionally conservative so a singular
    // item such as "a Grand ticket" never gets an "each" suffix.
    const singularExceptions = new Set([
        'business','businesses','class','glass','dress','address','status','bonus',
        'bus','gas','news','series','species','headquarters','sales','prices',
        'means','electronics','sales'
    ]);

    // The last noun-like word in the item description is the safest plural
    // signal. Common irregular/plural forms are included explicitly.
    const words = withoutTypes.replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    const pluralIrregular = new Set(['people','men','women','children','teeth','feet','mice','dice']);
    if (words.some(w => pluralIrregular.has(w))) return true;

    return words.some(w => {
        if (singularExceptions.has(w) || w.length < 3) return false;
        // Regular plural endings. Do not use a bare final "s" for words where
        // it is commonly part of the singular spelling.
        if (/ies$/.test(w)) return true;       // batteries, parties, accessories
        if (/(?:ches|shes|xes|zes)$/.test(w)) return true; // watches, brushes
        if (/s$/.test(w) && !/(?:ss|us|is)$/.test(w)) return true;
        return false;
    });
}

function othersAdHasNoPrice(text) {
    const value = (text || "").trim().replace(/\s+/g, " ");

    const rawOnlyAds = new Set(['Looking for a lawyer', 'Looking for a personal driver', 'Looking for a professional dancer', 'Looking for a DJ', 'Wedding at Church', 'Party at house № ', 'Party at Beach', 'Looking for a party', 'Looking to play Billiards', 'Looking to play dice', 'Looking to play poker', 'Looking for a 24/7 Store owner', 'Looking for a Clothing Shop owner', 'Looking for an Ammunition Store owner', 'Looking for a Gas Station owner', 'Looking for a Car sharing owner', 'Looking for a Juice Shop owner'].map(x => x.toLowerCase()));
    if (rawOnlyAds.has(value.replace(/[.]$/, "").toLowerCase())) return true;

    // Non-saleable / social / activity / location-style Others ads.
    // These should never receive Price or Budget.
    return /^(?:looking\s+(?:for|to)\b|.*\blooking\s+for\s+work\b|wedding\b|party\b|.*\bcar\s+meet\b|looking\s+to\s+play\b)/i.test(value);
}

function selectOthersTemplate() {
    const template = document.getElementById("othersTemplateSelect").value;
    if (!template) return;
    const cleanText = normalizeOthersAction(stripOthersPrice(template));
    document.getElementById("othersCustomText").value = cleanText;
    updateOthersSpecialFields();
    syncOthersPickerText();
    document.getElementById("othersCustomText2").value = "";
// Others templates never carry an item price. Price/Budget is controlled
    // only by the main price field, just like Real Estate, Auto and Business.
    document.getElementById("price").value = "";
    document.getElementById("priceEach").checked = detectOthersEach(cleanText);
    updateAd();
}

function buildOthersSubject(template, intent) {
    return normalizeOthersAction(stripOthersPrice(template || ""));
}

    .replace(/\s+for\s+(?:men|women)\s*$/i, "")

    .replace(/^(?:low|medium|high|premium|max)\s+quality\s+/i, "")
    .replace(/[.\s]+$/, "").trim().toLowerCase()).replace(/\s+of\s+type\s*$/i, "");

}

function updateOthersSpecialFields() {
    const controls = document.getElementById("othersSpecialControls");
    const color = document.getElementById("othersSpecialColor");
    const type = document.getElementById("othersSpecialType");
    const gender = document.getElementById("othersSpecialGender");
    const quality = document.getElementById("othersSpecialQuality");
    const colorWrap = document.getElementById("othersSpecialColorWrap");
    const typeWrap = document.getElementById("othersSpecialTypeWrap");
    const genderWrap = document.getElementById("othersSpecialGenderWrap");
    const qualityWrap = document.getElementById("othersSpecialQualityWrap");
    const grandWrap = document.getElementById("othersQuantityItemWrap");
    const input = document.getElementById("othersCustomText");
    const base = getOthersSpecialBaseItem();
    const isGrandTicket = isOthersQuantityItem(base);

    const isShoeColorType = OTHERS_SHOE_COLOR_TYPE_ITEMS.has(base);
    const isPantsColorType = OTHERS_PANTS_COLOR_TYPE_ITEMS.has(base);
    const isPantsTypeOnly = OTHERS_PANTS_TYPE_1_25_ITEMS.has(base) ||
            OTHERS_WATCH_TYPE_ITEMS.has(base);
    const isPrimeTypeOnly = OTHERS_PRIME_TYPE_ONLY_ITEMS.has(base);
    const isColorOnly = OTHERS_COLOR_ONLY_ITEMS.has(base);
    const isQualityItem = OTHERS_QUALITY_ITEMS.has(base) || OTHERS_LEVEL_QUALITY_ITEMS.has(base);
    const isGenderItem = OTHERS_GENDER_ITEMS.has(base);
    const isWatchTypeGenderItem = isOthersWatchTypeGenderItem(base);
    const isColorGenderItem = OTHERS_COLOR_GENDER_ITEMS.has(base);
    const isColorType = !isGenderItem && !isColorGenderItem && !isColorOnly && (OTHERS_COLOR_AND_TYPE_ITEMS.has(base) || OTHERS_COLOR_TYPE_1_10_ITEMS.has(base) || isShoeColorType || isPantsColorType);
    const isTypeOnly = !isColorGenderItem && !isColorOnly && (isWatchTypeGenderItem || (!isGenderItem && (OTHERS_TYPE_ONLY_ITEMS.has(base) || OTHERS_COLOR_TYPE_1_10_ITEMS.has(base) || OTHERS_SHOE_COLOR_TYPE_ITEMS.has(base) || isPantsTypeOnly || isPrimeTypeOnly)));

    if (!controls || !color || !type || !gender || !input) return;

    // Show the special row only when this item has special options.
    controls.classList.toggle("hidden", !(isColorType || isColorOnly || isTypeOnly || isGenderItem || isColorGenderItem || isQualityItem || isGrandTicket || isWatchTypeGenderItem));

    // Gender-only accessories: show Men/Women only.
    colorWrap?.classList.toggle("hidden", isGrandTicket || !(isColorType || isColorOnly || isColorGenderItem));
    typeWrap?.classList.toggle("hidden", isGrandTicket || isQualityItem || isColorOnly || isColorGenderItem || (isGenderItem && !isColorType && !isTypeOnly && !isWatchTypeGenderItem));
    genderWrap?.classList.toggle("hidden", isGrandTicket || !(isGenderItem || isColorGenderItem));
    qualityWrap?.classList.toggle("hidden", isGrandTicket || !isQualityItem);
    grandWrap?.classList.toggle("hidden", !isGrandTicket);
    if (isGrandTicket) {
        updateQuantityItemControls();
    } else {
        const bulk = document.getElementById("othersQuantityItemBulk");
        const qty = document.getElementById("othersQuantityItemQuantity");
        if (bulk) bulk.value = "";
        if (qty) qty.value = "";
    }

    if (!isColorType && !isColorOnly && !isColorGenderItem) color.value = "";
    if (isColorGenderItem || (isGenderItem && !isColorType && !isTypeOnly)) type.value = "";
    if (!isGenderItem && !isColorGenderItem) gender.value = "";
    if (!isQualityItem && quality) quality.value = "";

    // Limit the type list to the exact requested types for Prime / Prime Platinum.
    const primeTypeOnly = OTHERS_PRIME_TYPE_ONLY_ITEMS.has(base);
    // Limit the type list to 1-10 for the requested 1-10 items.
    const type10Only = OTHERS_TYPE_1_10_ITEMS.has(base) && !isShoeColorType && !isPantsColorType && !isPantsTypeOnly;
    Array.from(type.options).forEach(opt => {
        if (!opt.value) {
            opt.hidden = false;
        } else if (primeTypeOnly) {
            opt.hidden = ![7, 15, 21, 30].includes(Number(opt.value));
        } else {
            opt.hidden = type10Only && Number(opt.value) > 10;
        }
    });

    // Quality/level options: tuning items allow low/medium/high;
    // inventory also allow premium; fishing rod and pickaxe allow max.
    if (quality) {
        const supportsPremium = OTHERS_PREMIUM_QUALITY_ITEMS.has(base);
        const supportsMax = OTHERS_MAX_QUALITY_ITEMS.has(base);
        Array.from(quality.options).forEach(opt => {
            if (!opt.value) {
                opt.hidden = false;
            } else if (opt.value === "premium") {
                opt.hidden = !supportsPremium;
            } else if (opt.value === "max") {
                opt.hidden = !supportsMax;
            } else {
                opt.hidden = false;
            }
        });
        if (!supportsPremium && quality.value === "premium") quality.value = "";
        if (!supportsMax && quality.value === "max") quality.value = "";
    }
    if (primeTypeOnly && !["7", "15", "21", "30", ""].includes(type.value)) type.value = "";
    if (type10Only && Number(type.value) > 10) type.value = "";

    // Rebuild the editable item text without losing current selections.
    if (isColorType || isColorOnly || isTypeOnly || isGenderItem || isColorGenderItem || isQualityItem) {
        let value = normalizeOthersAction(stripOthersPrice(input.value))
            .replace(/\s+of type\s*#?\s*\d+\s*$/i, "")
            .replace(/\s+type\s*#?\s*\d+\s*$/i, "")
            .replace(/\s+for\s+(?:men|women)\s*$/i, "")
            .replace(/^(?:white|black|pink|purple|grey|gray|yellow|green|brown|red|blue)\s+/i, "")
            .replace(/^(?:low|medium|high)\s+quality\s+/i, "")
            .trim();

        const candidates = [
            ...OTHERS_COLOR_AND_TYPE_ITEMS,
            ...OTHERS_COLOR_TYPE_1_10_ITEMS,
            ...OTHERS_TYPE_ONLY_ITEMS,
            ...OTHERS_PRIME_TYPE_ONLY_ITEMS,
            ...OTHERS_QUALITY_ITEMS,
            ...OTHERS_LEVEL_QUALITY_ITEMS,
            ...OTHERS_GENDER_ITEMS,
            ...OTHERS_COLOR_GENDER_ITEMS,
            ...OTHERS_COLOR_ONLY_ITEMS
        ].sort((a, b) => b.length - a.length);

        const matched = candidates.find(item =>
            value.toLowerCase() === item ||
            value.toLowerCase().endsWith(" " + item)
        );
        if (matched) value = matched;

        if (isPrimeTypeOnly) {
            value = base === "prime platinum" ? "Prime Platinum" : "Prime";
        }

        const selectedColor = (isColorType || isColorOnly || isColorGenderItem) ? color.value : "";
        const selectedType = (isTypeOnly || isPrimeTypeOnly) ? type.value : "";
        const selectedGender = (isGenderItem || isColorGenderItem) ? gender.value : "";
        const selectedQuality = isQualityItem ? quality.value : "";

        if (selectedQuality) value = `${selectedQuality} quality ${value}`;
        if (selectedColor) value = `${selectedColor} ${value}`;
        if (selectedType) value += ` of type ${selectedType}`;
        if (selectedGender) value += ` for ${selectedGender}`;

        input.value = value;
    }
}

function getQuantityItemSubject() {
    const qtyEl = document.getElementById("othersQuantityItemQuantity");
    const qty = Math.max(1, parseInt(qtyEl?.value || "1", 10) || 1);
    const bulk = qty > 1 && document.getElementById("othersQuantityItemBulk")?.value === "bulk";
    const raw = (document.getElementById("othersCustomText")?.value || "").trim().toLowerCase();

    if (isOthersResourceMinerTicketItem(raw)) {
        const pluralSelected = /\bresource miners tickets\b/.test(raw);
        if (bulk) return `${qty} Resource miners tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Resource miners ticket";
        if (qty === 1 && pluralSelected) return "Resource miners tickets";
        return `${qty} Resource miners tickets`;
    }

    if (isOthersRoyalArtifactsTicketItem(raw)) {
        const pluralSelected = /\broyal artifacts tickets\b/.test(raw);
        if (bulk) return `${qty} Royal Artifacts tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Royal Artifacts ticket";
        if (qty === 1 && pluralSelected) return "Royal Artifacts tickets";
        return `${qty} Royal Artifacts tickets`;
    }

    if (isOthersRareLotteryTicketItem(raw)) {
        const pluralSelected = /\brare lottery tickets\b/.test(raw);
        if (bulk) return `${qty} Rare lottery tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Rare lottery ticket";
        if (qty === 1 && pluralSelected) return "Rare lottery tickets";
        return `${qty} Rare lottery tickets`;
    }

    if (isOthersCayoPericoTicketItem(raw)) {
        const pluralSelected = /\bcayo perico tickets\b/.test(raw);
        if (bulk) return `${qty} Cayo Perico tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Cayo Perico ticket";
        if (qty === 1 && pluralSelected) return "Cayo Perico tickets";
        return `${qty} Cayo Perico tickets`;
    }

    if (isOthersFlameWaterTicketItem(raw)) {
        const pluralSelected = /\bflame and water tickets\b/.test(raw);
        if (bulk) return `${qty} Flame and Water tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Flame and Water ticket";
        if (qty === 1 && pluralSelected) return "Flame and Water tickets";
        return `${qty} Flame and Water tickets`;
    }

    if (isOthersSpongeItem(raw)) {
        if (qty > 1) return `${qty} sponges in bulk`;
        return "sponges in bulk";
    }

    if (isOthersMaterialQuantityItem(raw)) {
        if (raw === "a hookah") {
            if (bulk) return `${qty} hookahs in bulk`;
            if (qty === 1) return "a hookah";
            return `${qty} hookahs`;
        }
        const display = formatOthersDisplayName(raw);
        if (bulk) return `${qty} ${display} in bulk`;
        if (qty === 1) return display;
        return `${qty} ${display}`;
    }

    if (isOthersJuiceItem(raw)) {
        if (bulk) return `${qty} ${raw} in bulk`;
        return qty === 1 ? raw : `${qty} ${raw}`;
    }

    if (isOthersContainerItem(raw)) {
        const display = formatOthersDisplayName(
            raw.replace(/^(?:a\s+|\d+\s+)?/i, "").replace(/\s+$/i, "")
        );
        if (bulk) return `${qty} ${display} in bulk`;
        return qty === 1 ? display : `${qty} ${display}`;
    }

    if (isOthersBatteryItem(raw)) {
        const pluralSelected = /\bbatteries\b/.test(raw);
        if (bulk) return `${qty} batteries in bulk`;
        if (qty === 1 && !pluralSelected) return "a battery";
        if (qty === 1 && pluralSelected) return "batteries";
        return `${qty} batteries`;
    }

    if (isOthersSecretTicketFragmentItem(raw)) {
        const pluralSelected = /\bsecret ticket fragments\b/.test(raw);
        if (bulk) return `${qty} Secret Ticket fragments in bulk`;
        if (qty === 1 && !pluralSelected) return "a Secret Ticket fragment";
        if (qty === 1 && pluralSelected) return "Secret Ticket fragments";
        return `${qty} Secret Ticket fragments`;
    }

    if (isOthersCarTicketItem(raw)) {
        const pluralSelected = /\bcar tickets\b/.test(raw);
        if (bulk) return `${qty} Car tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Car ticket";
        if (qty === 1 && pluralSelected) return "Car tickets";
        return `${qty} Car tickets`;
    }

    if (isOthersSecretTicketItem(raw)) {
        const pluralSelected = /\bsecret tickets\b/.test(raw);
        if (bulk) return `${qty} Secret Tickets in bulk`;
        if (qty === 1 && !pluralSelected) return "a Secret Ticket";
        if (qty === 1 && pluralSelected) return "Secret Tickets";
        return `${qty} Secret Tickets`;
    }

    const pluralSelected = /\bgrand tickets\b/.test(raw);
    if (bulk) return `${qty} Grand tickets in bulk`;
    if (qty === 1 && !pluralSelected) return "a Grand ticket";
    if (qty === 1 && pluralSelected) return "Grand tickets";
    return `${qty} Grand tickets`;
}

function getOthersItems() {
    const selected = document.getElementById("othersTemplateSelect")?.value || "";
    const item1 = (document.getElementById("othersCustomText")?.value || "").trim();
    const item2 = (document.getElementById("othersCustomText2")?.value || "").trim();
    const values = [item1 || selected, item2]
        .map(v => normalizeOthersAction(stripOthersPrice(v)))
        .map(v => v.replace(/[.\s]+$/, "").trim())
        .map(formatOthersDisplayName)
        .filter(Boolean);

    // Grand ticket uses quantity/bulk controls and never uses E/Price-per-item.
    if (values.length > 0 && isOthersQuantityItem(values[0])) {
        values[0] = getQuantityItemSubject();
    }

    // Safety-net for special selectors: Type is added only to items that
    // explicitly support Type. Prime / Prime Platinum are handled directly
    // here so the selected type is never lost between the selector and output.
    if (values.length > 0) {
        const typeEl = document.getElementById("othersSpecialType");
        const selectedType = typeEl?.value || "";
        const rawItem1 = (document.getElementById("othersCustomText")?.value || "").trim();
        const base = getOthersSpecialBaseItem();
        const isPrime = OTHERS_PRIME_TYPE_ONLY_ITEMS.has(base);
        const supportsType = isOthersWatchTypeGenderItem(base) || isPrime || (!OTHERS_COLOR_GENDER_ITEMS.has(base) && (
            OTHERS_TYPE_ONLY_ITEMS.has(base) ||
            OTHERS_TYPE_1_10_ITEMS.has(base) ||
            OTHERS_COLOR_TYPE_1_10_ITEMS.has(base) ||
            OTHERS_COLOR_AND_TYPE_ITEMS.has(base) ||
            OTHERS_SHOE_COLOR_TYPE_ITEMS.has(base) ||
            OTHERS_PANTS_COLOR_TYPE_ITEMS.has(base) ||
            OTHERS_PANTS_TYPE_1_25_ITEMS.has(base) ||
            OTHERS_WATCH_TYPE_ITEMS.has(base)
        ));
        const alreadyHasType = /\b(?:of\s+)?type\s*#?\s*\d+\b/i.test(values[0]);
        if (supportsType && selectedType && !alreadyHasType) {
            values[0] = `${values[0]} of type ${selectedType}`;
        }

        // Preserve the exact database capitalization for Prime / Prime Platinum.
        if (isPrime) {
            const canonicalPrime = base === "prime platinum" ? "Prime Platinum" : "Prime";
            values[0] = values[0]
                .replace(/^prime platinum/i, canonicalPrime)
                .replace(/^prime(?! platinum)/i, canonicalPrime);
        }
    }

    // Do not repeat the same item if it was entered twice.
    const seen = new Set();
    return values.filter(v => {
        const key = v.toLowerCase().replace(/\s+/g, " ").trim();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

function joinOthersItems(items) {
    if (items.length === 0) return "";
    if (items.length === 1) return items[0];
    if (items.length === 2) return `${items[0]} and ${items[1]}`;
    return `${items[0]}, ${items[1]} and ${items[2]}`;
}

function formatOthersDisplayName(str) {
    let value = String(str || "").trim();
    value = value.replace(/\blui\s+vi\b/gi, "Lui Vi");
    value = value.replace(/\bprogen\b/gi, "Progen");
    value = value.replace(/\bvolex\b/gi, "Volex");
    value = value.replace(/\bkolex\b/gi, "Kolex");
    value = value.replace(/\babibas\b/gi, "Abibas");
    return value;
}

function capitalizeWords(str) {
    return str.replace(/\b\w/g, l => l.toUpperCase());
}

function formatCarName(name) {
    let clean = name.trim();
    if (!clean) return "";
    
    clean = clean.replace(/max config|max tuning|fully upgraded/gi, "");
    clean = clean.replace(/body upgrades|body kit/gi, "");
    clean = clean.replace(/luminous rims|unique wheels/gi, "");
    
    clean = capitalizeWords(clean);
    clean = clean.replace(/\((E|Cs|G|W|Fd|Li|R)\s*(\d+)?\)/gi, (m, p1, p2) => `(${p1.toUpperCase()}${p2 ? p2 : ""})`);

    return `"${clean}"`;
}

function parsePriceRules(rawPrice, intent, allowEach = false) {
    let clean = rawPrice.trim();
    if (clean === "") return { value: "Negotiable", isNumeric: false, each: false };
    if (clean.toLowerCase() === "negotiable") return { value: "Negotiable", isNumeric: false, each: false };

    // Add "E" after a price to mean "each". Examples: 100K E, 3M E, 500 E.
    // The E is a suffix marker only; it is not part of the numeric price.
    const each = allowEach && /(?:^|\s)e\s*$/i.test(clean);
    clean = clean.replace(/\s+e\s*$/i, '').trim();

    clean = clean.replace(/\$/g, '').replace(/,/g, '.');

    if (/^[0-9.]+\s*[mM]$/.test(clean)) {
        let numPart = clean.match(/[0-9.]+/)[0];
        clean = numPart + " million";
    }

    if (/[0-9.]+[mM]\b/.test(clean) || clean.toLowerCase().includes("million")) {
        let numPart = clean.match(/[0-9.]+/);
        if (numPart && parseFloat(numPart[0]) > 500) return { value: "Negotiable", isNumeric: false, each };
        return { value: "$" + numPart[0] + " Million", isNumeric: false, each }; 
    }
    if (/[0-9.]+[kK]\b/.test(clean)) {
        let numPart = clean.match(/[0-9.]+/)[0];
        if (!numPart.includes('.')) numPart = numPart + ".000";
        return { value: "$" + numPart, isNumeric: true, each };
    }

    if (clean.toLowerCase().includes("billion")) return { value: "Negotiable", isNumeric: false, each };

    if (/^[0-9.]+$/.test(clean)) {
        let structuralCheck = clean.replace(/\./g, '');
        if (parseFloat(structuralCheck) > 500000000) return { value: "Negotiable", isNumeric: false, each };
        return { value: "$" + clean, isNumeric: true, each };
    }

    return { value: clean, isNumeric: false, each };
}

function updateAd() {
    const category = document.querySelector('input[name="category"]:checked').value;
    const intent = document.querySelector('input[name="intent"]:checked').value;
    const rawPrice = document.getElementById('price').value;
    const resultCard = document.getElementById('resultCard');
    const adPreview = document.getElementById('adPreview');
    const copyBtn = document.getElementById('copyBtn');

    resultCard.classList.remove('error-box');
    adPreview.classList.remove('error-text');
    copyBtn.classList.remove('hidden');
    document.getElementById('tradeForWrapper').classList.add('hidden');
    document.getElementById('priceWrapper').style.visibility = "visible";

    const priceLabel = document.getElementById('priceLabel');
    if (intent === 'Buying') priceLabel.innerText = "Budget";
    else priceLabel.innerText = "Price";

    if (category === "others") {
        const rawFirstOthersItem = document.getElementById("othersCustomText")?.value || "";
        const quantityItem = isOthersQuantityItem(rawFirstOthersItem);
        const firstOthersItem = getOthersItems()[0] || "";
        const tuningItem = isOthersTuningItem(firstOthersItem);
        const eachControl = document.getElementById('priceEachControl');
        if (eachControl) eachControl.style.display = tuningItem ? '' : 'none';
        if (quantityItem) {
            updateQuantityItemControls();
            const eachCheckbox = document.getElementById('priceEach');
            if (eachCheckbox) eachCheckbox.checked = false;
        } else if (!tuningItem) {
            const eachCheckbox = document.getElementById('priceEach');
            if (eachCheckbox) eachCheckbox.checked = false;
        }
    } else {
        const eachControl = document.getElementById('priceEachControl');
        if (eachControl) eachControl.style.display = 'none';
        const eachCheckbox = document.getElementById('priceEach');
        if (eachCheckbox) eachCheckbox.checked = false;
    }

    if (intent === "Trading") {
        document.getElementById('priceWrapper').style.visibility = "hidden";
        if (category === "auto") document.getElementById('tradeForWrapper').classList.remove('hidden');
    }

    let coreSubjectText = "";
    let featuresList = [];
    let locationSuffixStr = "";

    // ================= REAL ESTATE =================
    if (category === "realestate") {
        const propertyType = document.querySelector('input[name="property"]:checked').value;
        const propNumber = document.getElementById('propNumber').value.trim();
        const location = document.getElementById('locationSelect').value;

        const numberLabel = document.getElementById('numberLabel');
        if (propertyType === 'house') numberLabel.innerText = "House № (Optional)";
        else numberLabel.innerText = "Apartment № (Optional)";

        if (propNumber && intent !== "Buying") {
            coreSubjectText = `${propertyType} №${propNumber}`;
        } else {
            coreSubjectText = (propertyType === 'house') ? 'a house' : 'an apartment';
        }

        if (document.getElementById('feat_garden').checked) featuresList.push("garden");
        if (document.getElementById('feat_garage').checked) featuresList.push(document.getElementById('garage_val').value);
        if (document.getElementById('feat_custom').checked) featuresList.push("custom interior");
        if (document.getElementById('feat_insurance').checked) featuresList.push("insurance");
        if (document.getElementById('feat_pool').checked) featuresList.push("swimming pool");
        if (document.getElementById('feat_tennis').checked) featuresList.push("tennis court");
        if (document.getElementById('feat_heli').checked) featuresList.push("helipad");
        if (document.getElementById('feat_driveway').checked) featuresList.push("driveway");
        if (document.getElementById('feat_backyard').checked) featuresList.push("backyard");
        if (document.getElementById('feat_nice').checked) featuresList.push("Nice view");
        if (document.getElementById('feat_beautiful').checked) featuresList.push("beautiful view");
        if (document.getElementById('feat_great').checked) featuresList.push("great view");

        if (location) {
            const nearLocations = ["beach market", "Lifeinvader", "Postal"];
            if (nearLocations.includes(location)) {
                locationSuffixStr = ` near ${location}`;
            } else {
                locationSuffixStr = ` in ${location}`;
            }
        }

    // ================= AUTOMOTIVE =================
    } else if (category === "auto") {
        const autoType = document.querySelector('input[name="autoType"]:checked').value;
        const carNameInput = document.getElementById('carName').value;
        const autoLocation = document.getElementById('autoLocation').value;
        const tradeForInput = document.getElementById('tradeForVehicle').value;

        if (carNameInput.trim()) {
            coreSubjectText = formatCarName(carNameInput);
        } else {
            coreSubjectText = `a ${autoType}`;
        }

        if (intent === "Trading" && tradeForInput.trim()) {
            coreSubjectText += ` for ${formatCarName(tradeForInput)}`;
        }

        if (document.getElementById('veh_config').checked) featuresList.push(document.getElementById('veh_config_val').value);
        if (document.getElementById('veh_visual').checked) featuresList.push("visual upgrades");
        if (document.getElementById('veh_luminous').checked) featuresList.push("luminous wheels");
        if (document.getElementById('veh_insurance').checked) featuresList.push("insurance");
        if (document.getElementById('veh_turbo').checked) featuresList.push("turbo kit");
        if (document.getElementById('veh_drift').checked) featuresList.push("drift kit");

        if (autoLocation === "Auto Fair") {
            locationSuffixStr = " at Auto Fair";
        }

    // ================= OTHERS =================
    } else if (category === "others") {
        const othersItems = getOthersItems();
        const displayOthersItems = othersItems.map(item => {
            const clean = item.replace(/[.\s]+$/, '').trim();
            const lower = clean.toLowerCase();
            return OTHERS_PET_ITEMS.has(lower) ? `a pet ${clean}` : clean;
        });
        coreSubjectText = joinOthersItems(displayOthersItems);
        // More than one item is always a bundle/list ad, so its price is not
        // treated as an item price. The output must remain Negotiable.
        if (othersItems.length > 1) {
            document.getElementById("priceEach").checked = false;
        } else if (othersItems.length === 1) {
            document.getElementById("priceEach").checked = detectOthersEach(othersItems[0]);
        }

    // ================= BUSINESS =================
    } else if (category === "business") {
        const bizRegistryType = document.getElementById("businessTypeSelect").value;
        const bizNumber = document.getElementById("businessNumber").value.trim();

        let coreTitle = bizRegistryType;
        let suffixBusinessWord = bizNumber ? "" : " business";

        if (bizRegistryType === "business") {
            coreTitle = "a business";
            suffixBusinessWord = ""; 
        } else if (bizRegistryType === "private business" || bizRegistryType === "family business") {
            coreTitle = bizRegistryType;
            suffixBusinessWord = "";
        } else if (bizRegistryType === "Plantation") {
            const crop = document.getElementById("plantationCrop").value.trim();
            coreTitle = crop ? `${capitalizeWords(crop)} Plantation` : "Plantation";
            
            const beds = document.getElementById("plantationBeds").value;
            if (beds) featuresList.push(beds);
        }

        if (bizNumber) {
            coreSubjectText = `${coreTitle} №${bizNumber}`;
        } else {
            coreSubjectText = `${coreTitle}${suffixBusinessWord}`;
        }
    }

    let featuresString = "";
    if (featuresList.length > 0) {
        if (featuresList[0].startsWith("with ")) {
            let firstFeature = featuresList.shift(); 
            featuresString = " " + firstFeature;
            if (featuresList.length === 1) {
                featuresString += " and " + featuresList[0];
            } else if (featuresList.length > 1) {
                let lastItem = featuresList.pop();
                featuresString += ", " + featuresList.join(", ") + " and " + lastItem;
            }
        } else {
            if (featuresList.length === 1) {
                featuresString = " with " + featuresList[0];
            } else if (featuresList.length === 2) {
                featuresString = " with " + featuresList[0] + " and " + featuresList[1];
            } else {
                let lastItem = featuresList.pop();
                featuresString = " with " + featuresList.join(", ") + " and " + lastItem;
            }
        }
    }

    let firstHalfDescription;
    if (category === "others") {
        // Others: "Looking for / Looking to ..." ads are standalone ads and
        // must NOT receive a Buying/Selling/Trading prefix. All other Others
        // ads keep the selected action exactly once at the front.
        // Non-sellable Others ads are always raw/standalone: no Buying,
        // Selling, or Trading prefix. This includes Looking-for ads,
        // weddings, parties, car meets, and game/activity ads.
        const othersStandalone = othersAdHasNoPrice(coreSubjectText);
        firstHalfDescription = othersStandalone
            ? `${coreSubjectText}${featuresString}${locationSuffixStr}`
            : `${intent} ${coreSubjectText}${featuresString}${locationSuffixStr}`.replace(/^(\S+)\s+\1\s+/i, "$1 ");
    } else {
        firstHalfDescription = `${intent} ${coreSubjectText}${featuresString}${locationSuffixStr}`;
    }
    let baseSentenceDot = firstHalfDescription.trim().endsWith(".") ? "" : ".";

    let outputAdSentence = "";
    const allowOthersEach = category === "others" && isOthersTuningItem((getOthersItems()[0] || ""));
    const quantityRawItemForPrice = category === "others" ? (document.getElementById("othersCustomText")?.value || "") : "";
    const isQuantityItemForPrice = category === "others" && isOthersQuantityItem(quantityRawItemForPrice);
    // Quantity ticket items do not accept E; E is reserved for tuning parts.
    const priceInputForParse = isQuantityItemForPrice ? rawPrice.replace(/\s+e\s*$/i, "") : rawPrice;
    const priceObj = parsePriceRules(priceInputForParse, intent, allowOthersEach);
    // Sponges are always bulk and a real price is always per item.
    if (category === "others" && getOthersItems().length === 1 &&
        isOthersSpongeItem(getOthersItems()[0]) &&
        priceObj.value !== "Negotiable") {
        priceObj.each = true;
    }

    // Only timber and biospark append "each." after a real price.
    // Negotiable never gets "each.".
    if (category === "others" && getOthersItems().length === 1 &&
        isOthersAlwaysEachItem(getOthersItems()[0]) &&
        priceObj.value !== "Negotiable") {
        priceObj.each = true;
    }

    let parsedPriceText = priceObj.value;

    const quantityBulkForPrice = isQuantityItemForPrice && document.getElementById("othersQuantityItemBulk")?.value === "bulk";
    const quantityQtyForPrice = isQuantityItemForPrice ? Math.max(1, parseInt(document.getElementById("othersQuantityItemQuantity")?.value || "1", 10) || 1) : 1;
    // A plural database selection (e.g. "Grand tickets") is plural even when
    // How many is 1, so a numeric price must still be marked "each.".
    const quantityPluralSelectedForPrice = isQuantityItemForPrice && (() => {
        const raw = (document.getElementById("othersCustomText")?.value || "").trim().toLowerCase();
        return /\b(?:grand|resource miners|royal artifacts|rare lottery|cayo perico|secret) tickets\b/.test(raw)
            || /\bsecret ticket fragments\b/.test(raw)
            || isOthersJuiceItem(raw)
            || isOthersContainerItem(raw)
            || isOthersMaterialQuantityItem(raw);
    })();
    const quantityMultipleForPrice = isQuantityItemForPrice && (quantityQtyForPrice > 1 || quantityBulkForPrice);
    if (quantityMultipleForPrice && priceObj && !/^Negotiable$/i.test(String(priceObj.value || "").trim())) priceObj.each = true;

    if (category === "auto" && document.getElementById('autoLocation').value === "Auto Fair" && parsedPriceText === "Negotiable") {
        outputAdSentence = `${firstHalfDescription}${baseSentenceDot}`;
    } else if (intent === "Trading") {
        outputAdSentence = `${firstHalfDescription}${baseSentenceDot}`;
    } else {
        const labelHeader = priceLabel.innerText;
        const othersItems = category === "others" ? getOthersItems() : [];
        const multipleOthersItems = category === "others" && othersItems.length > 1;

        // Others:
        // - 2 or 3 items are always Negotiable.
        // - Looking/social/activity/location-style ads are NOT sellable items,
        //   so they never receive Price/Budget at all.
        // - A single real item may use the entered price.
        const noPriceOthersAd = category === "others" && othersItems.some(item => othersAdHasNoPrice(item));

        // In Others, "Price is per item" can be enabled in either way:
        // 1) check the checkbox, or 2) type E after the price (e.g. 3M E).
        // Both methods produce the same "each" result.
        const eachByCheckbox = category === "others" && isOthersTuningItem((getOthersItems()[0] || "")) && document.getElementById("priceEach")?.checked === true;
        if (category === "others" && eachByCheckbox && priceObj && !priceObj.each) {
            priceObj.each = true;
        }

        if (multipleOthersItems) {
            parsedPriceText = "Negotiable";
        }

        if (noPriceOthersAd) {
            outputAdSentence = `${firstHalfDescription}${baseSentenceDot}`;
        } else {
            // A trailing E in the price means "each". Keep the price value
            // unchanged and append " each." before the final period.
            const quantityRawForSuffix = (document.getElementById("othersCustomText")?.value || "").trim().toLowerCase();
            const quantityPluralSelected = isQuantityItemForPrice && ( /\b(?:grand tickets|resource miners tickets|royal artifacts tickets|rare lottery tickets|cayo perico tickets|car tickets|secret tickets|secret ticket fragments|batteries|sponges|progen containers|old winter containers|old summer containers|valuable containers|truckers containers|organisation containers|desert scarf mask containers|racers containers|ingrand containers|daily containers|resources containers|gardeners containers|wheels containers|juices|10% juices|20% juices|10% attack juices|10% protection juices|20% attack juices|20% protection juices|10% and 20% juices|immunity juices|power juices|riding juices|endurance juices|juices of fast run|juices of double paycheck|juices of becoming animal|bunker juices)\b/.test(quantityRawForSuffix) || isOthersContainerItem(quantityRawForSuffix) );
            const quantityNeedsEach = isQuantityItemForPrice && (quantityQtyForPrice > 1 || quantityBulkForPrice || quantityPluralSelected);
            const eachSuffix = !multipleOthersItems && !/^Negotiable$/i.test(parsedPriceText.trim()) && (priceObj.each || quantityNeedsEach) ? " each." : "";
            // Negotiable always ends with a period for both Price and Budget.
            const negotiableSuffix = !priceObj.each && /^Negotiable$/i.test(parsedPriceText.trim()) ? "." : "";
            // A plain Million amount ends with a period too (e.g. "$3 Million.").
            // Non-Million numeric prices do not get this extra period.
            const millionPriceSuffix = !priceObj.each && !negotiableSuffix && /\bMillion$/i.test(parsedPriceText.trim()) ? "." : "";
            outputAdSentence = `${firstHalfDescription}${baseSentenceDot} ${labelHeader}: ${parsedPriceText}${eachSuffix}${negotiableSuffix}${millionPriceSuffix}`;
        }
    }

    adPreview.innerText = outputAdSentence;
}

filterVehicles();
</script>
<script>
function updateApartmentFeatures() {
    const isApartment = document.getElementById("prop_apt")?.checked;
    [1,5,6,7,8,9,10,11,12,13].forEach(n => {
        const el = document.getElementById("feature" + n);
        if (el) {
            el.classList.toggle("hidden", isApartment);
            const checkbox = el.querySelector("input[type=checkbox]");
            if (isApartment && checkbox) checkbox.checked = false;
        }
    });
}

function updatePropertyBuyingRules() {
    const intentEl = document.querySelector('input[name="intent"]:checked');
    const propertyEl = document.querySelector('input[name="property"]:checked');
    const numberInput = document.getElementById("propNumber");
    const numberLabel = document.getElementById("numberLabel");
    const garageSelect = document.getElementById("garage_val");

    if (!intentEl || !propertyEl || !numberInput || !numberLabel || !garageSelect) return;

    const isBuying = intentEl.value === "Buying";
    const isApartment = propertyEl.value === "apartment";

    // Buying ads must never include a House/Apartment number.
    const numberField = numberInput.closest("div");
    if (numberField) numberField.style.display = isBuying ? "none" : "";
    if (isBuying) numberInput.value = "";

    // For apartments only, remove 2 g.s. and 5 g.s.
    const currentValue = garageSelect.value;
    Array.from(garageSelect.options).forEach(option => {
        const remove = isApartment &&
            (option.value === "2 g.s." || option.value === "5 g.s.");
        option.hidden = remove;
        option.disabled = remove;
    });

    if (isApartment && (currentValue === "2 g.s." || currentValue === "5 g.s.")) {
        garageSelect.selectedIndex = 0;
    }
}

const _oldUpdateAd = updateAd;
updateAd = function() {
    _oldUpdateAd();
    updatePropertyBuyingRules();
};
</script>
